{% extends "base_generic.html" %}

{% block content %}
  <h1>Animals</h1>
  <p class="text-muted">Pick a type to see its animals.</p>

  {% if animal_type_list %}
  <div class="list-group" style="max-width: 480px;">
    {% for ani in animal_type_list %}
      <a class="list-group-item list-group-item-action" href="{% url 'animallist' ani.animal_type %}">
        {{ ani.animal_type }}
      </a>
    {% endfor %}
  </div>
  {% else %}
    <p class="text-muted">There are no animal types to display.</p>
  {% endif %}
{% endblock %}
