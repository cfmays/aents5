{% if show %}
<div class="modal fade" id="announcementModal" tabindex="-1" role="dialog" aria-labelledby="announcementTitle" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="announcementTitle">What's new</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <ul>
          <li><strong>Companion animal:</strong> an encounter can now include a second, optional animal.</li>
          <li><strong>Three handlers:</strong> Retrieval (required), Presentation, and Return.</li>
          <li><strong>Participation:</strong> "Refused" is now "Refused at the start", and there is a new choice, "Refused at the program".</li>
        </ul>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal">Got it</button>
      </div>
    </div>
  </div>
</div>
<script>
$(document).ready(function () {
  $("#announcementModal").modal("show");
});
</script>
{% endif %}
