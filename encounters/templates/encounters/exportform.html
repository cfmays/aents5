{% extends "base_generic.html" %}

{% block content %}
<h1>Choose Export Options</h1>
<p class="text-muted">
  Limit the data by filling in any or all of these fields, then click Submit.<br>
  Leave all fields blank to get every record in the database.
</p>

<form action="{% url 'export-options' %}" method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
  $("#id_animalType").change(function () {
    var url = "{% url 'ajax_load_animals' %}";
    var theAnimalTypeID = $(this).val();
    $.ajax({
      url: url,
      data: { 'theAnimalTypeID': theAnimalTypeID },
      success: function (data) {
        $("#id_animals").html(data);
      }
    });
  });
</script>
{% endblock %}
