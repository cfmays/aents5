{% extends "base_generic.html" %}

{% block content %}
<h1>Animal Encounters</h1>
<p class="lead">Welcome to Animal Encounters.</p>

<div class="row mt-4">
  <div class="col-sm-4 mb-3">
    <div class="card text-center">
      <div class="card-body">
        <h2 class="card-title">{{ num_animals }}</h2>
        <p class="card-text text-muted">Animals</p>
      </div>
    </div>
  </div>
  <div class="col-sm-4 mb-3">
    <div class="card text-center">
      <div class="card-body">
        <h2 class="card-title">{{ num_users }}</h2>
        <p class="card-text text-muted">Users</p>
      </div>
    </div>
  </div>
  <div class="col-sm-4 mb-3">
    <div class="card text-center">
      <div class="card-body">
        <h2 class="card-title">{{ num_encounters }}</h2>
        <p class="card-text text-muted">Encounters</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
