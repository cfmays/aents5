{% extends "base_generic.html" %}

{% block content %}
<h1>New Encounter</h1>
<form action="/encounters/openencounter/" method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$("#id_animal").change(function () {
    var url = "{% url 'animal-data-API' %}"
    //console.log('url:',url)
    var animalId = $("#id_animal").val();
    //console.log('animalID: ', animalId);
    $.ajax({
        url: url,
        data: {
            'animal': animalId
        },
        success: function (data) {
            uses = data['uses'];
            theMax = data['theMax'];
            theAnimalComments = data['theAnimalComments'];
            if (uses > theMax) {
                $("#id_numPerDayField").css("color", "red");
            } else if (uses == theMax) {
                $("#id_numPerDayField").css("color", "red");
            } else {
                $("#id_numPerDayField").css("color", "black");
            }
            theStr = uses.toString() + ' (out of ' + theMax.toString() + ')';
            $("#id_numPerDayField").val(theStr);
            
            theStr=data['theAnimalComments'];
            $("#id_animalCommentsField").val(theStr);
            
        }
    });
})

</script>

{% endblock %}
