{% extends "base_generic.html" %}

{% block content %}
<h1>New Encounter</h1>
<form action="/encounters/openencounter/" method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$("#id_animal").change(function () {
    var url = "{% url 'animal-data-API' %}"
    //console.log('url:',url)
    var animalId = $("#id_animal").val();
    //console.log('animalID: ', animalId);
    $.ajax({
        url: url,
        data: {
            'animal': animalId
        },
        success: function (data) {
            uses = data['uses'];
            theMax = data['theMax'];
            theAnimalComments = data['theAnimalComments'];
            if (uses > theMax) {
                $("#id_numPerDayField").css("color", "red");
            } else if (uses == theMax) {
                $("#id_numPerDayField").css("color", "red");
            } else {
                $("#id_numPerDayField").css("color", "black");
            }
            theStr = uses.toString() + ' (out of ' + theMax.toString() + ')';
            $("#id_numPerDayField").val(theStr);
            
            theStr=data['theAnimalComments'];
            $("#id_animalCommentsField").val(theStr);

        }
    });
})

// progressive disclosure: only show fields relevant to the current step
// walk up from the field to whichever element as_p() put directly in the form
// (usually a <p>, but a RadioSelect's options sit in a bare <div>)
function fieldRow(id) {
    var el = document.getElementById(id);
    if (!el) return $();
    while (el.parentElement && el.parentElement.tagName !== "FORM") {
        el = el.parentElement;
    }
    return $(el);
}

function updateFieldVisibility() {
    var animalChosen = $("#id_animal").val();
    var participationRow = fieldRow("id_participation_0");
    var afterAnimalRows = fieldRow("id_numPerDayField")
        .add(fieldRow("id_animalCommentsField"))
        .add(fieldRow("id_companion"))
        .add(participationRow.prev("p"))
        .add(participationRow);
    var participationValue = $("input[name='participation']:checked").val();
    var commentsRow = fieldRow("id_comments");
    var participatedOnlyRows = fieldRow("id_handling_time")
        .add(fieldRow("id_crate_time"))
        .add(fieldRow("id_holding_time"));

    if (animalChosen) {
        afterAnimalRows.show();
    } else {
        afterAnimalRows.hide();
        participationValue = undefined;
    }

    if (participationValue === "refused") {
        // refused at the start: animal never went out, so no times
        commentsRow.show();
        participatedOnlyRows.hide();
    } else if (participationValue === "participated" || participationValue === "refused_program") {
        commentsRow.show();
        participatedOnlyRows.show();
    } else {
        commentsRow.hide();
        participatedOnlyRows.hide();
    }
}

$(document).ready(function () {
    updateFieldVisibility();
    $("#id_animal").change(updateFieldVisibility);
    $("input[name='participation']").change(updateFieldVisibility);
});
</script>

{% endblock %}
